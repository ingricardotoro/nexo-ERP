# AWS Amplify Build Settings — NexoERP
# Configuración de build para Amplify Gen 2 Hosting
# Aplicable a: staging (rama staging) y production (rama main)

version: 1

backend:
  phases:
    build:
      commands:
        - echo "🔧 Desplegando backend CDK (Cognito, Lambda, Storage)..."
        - npm ci --include=dev
        - echo "🔧 Instalando dependencias de Lambda functions..."
        - cd amplify/functions/generate-invoice-pdf && npm install && cd ../../..
        - cd amplify/functions/post-confirmation && npm install && cd ../../..
        - cd amplify/functions/check-cai-alerts && npm install && cd ../../..
        - echo "✅ Lambda dependencies instaladas"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - echo "✅ Backend CDK desplegado"

frontend:
  phases:
    # ===== Pre-build: Instalación de dependencias =====
    preBuild:
      commands:
        - echo "🔧 Instalando dependencias..."
        - export NPM_CONFIG_PRODUCTION=false
        - npm ci --include=dev
        - echo "✅ Dependencias instaladas"

        - echo "🔧 Generando Prisma Client..."
        - npx prisma generate
        - echo "✅ Prisma Client generado"

    # ===== Build: Compilación de Next.js =====
    build:
      commands:
        - echo "🏗️  Building Next.js application..."
        - export NODE_OPTIONS=--max-old-space-size=4096
        - npm run build
        - echo "✅ Build completado"

        # ===== Runtime env para SSR Lambda =====
        # Amplify Gen 2 no inyecta las env vars del Console al SSR Lambda.
        # Las escribimos en .next/env.lambda para que instrumentation.ts
        # las cargue al arrancar el servidor (antes de cualquier request).
        - echo "📝 Escribiendo runtime env para Lambda SSR..."
        - |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=${DIRECT_URL:-$DATABASE_URL}"
            echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID"
            echo "COGNITO_USER_POOL_CLIENT_ID=$COGNITO_USER_POOL_CLIENT_ID"
            echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"
            echo "NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV"
            echo "NEXT_PUBLIC_APP_NAME=$NEXT_PUBLIC_APP_NAME"
            echo "S3_BUCKET_DOCUMENTS=$S3_BUCKET_DOCUMENTS"
            echo "SQS_QUEUE_URL_INVOICE_PDF=$SQS_QUEUE_URL_INVOICE_PDF"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=$SMTP_PORT"
            echo "SES_FROM_EMAIL=$SES_FROM_EMAIL"
          } > .next/env.lambda
        - echo "✅ Runtime env escrita en .next/env.lambda"

  # ===== Artifacts: Archivos a desplegar =====
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  # ===== Cache: Optimizar builds subsecuentes =====
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

# ===== Monorepo: No aplica (single-app por ahora) =====
# Si en el futuro se convierte en monorepo, descomentar:
# appRoot: packages/web

